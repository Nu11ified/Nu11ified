name: Refresh the Orochi commit map

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: orochi-map

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Says why a bad token fails without printing it: its kind, its length, and what GitHub answers.
      - name: Check the token
        env:
          TOKEN: ${{ secrets.OROCHI_MAP_TOKEN }}
        run: |
          token=$(printf %s "$TOKEN" | tr -d '[:space:]')
          case "$token" in github_pat_*) kind="fine-grained";; ghp_*) kind="classic";; gho_*) kind="oauth";; *) kind="not a GitHub token";; esac
          user=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" https://api.github.com/user)
          repo=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" https://api.github.com/repos/GoliathData/sourcing)
          echo "token: $kind, ${#token} chars; /user -> $user; GoliathData/sourcing -> $repo"
          [ "$repo" = 200 ] || { echo "::error::OROCHI_MAP_TOKEN cannot read GoliathData/sourcing (/user $user, repo $repo)"; exit 1; }

      # Commits only, no trees or blobs, from the day Orochi started landing main.
      # The token is trimmed in case it was pasted with a trailing newline.
      - name: Fetch the monorepo's history
        env:
          TOKEN: ${{ secrets.OROCHI_MAP_TOKEN }}
        run: |
          token=$(printf %s "$TOKEN" | tr -d '[:space:]')
          auth=$(printf 'x-access-token:%s' "$token" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraHeader="Authorization: Basic $auth" clone -q --filter=tree:0 --no-checkout \
            --single-branch --branch main --shallow-since=2026-10-21 \
            https://github.com/GoliathData/sourcing.git "$RUNNER_TEMP/sourcing"
          git -C "$RUNNER_TEMP/sourcing" config http.extraHeader "Authorization: Basic $auth"

      - name: Draw the map
        env:
          TOKEN: ${{ secrets.OROCHI_MAP_TOKEN }}
        run: |
          export GH_TOKEN=$(printf %s "$TOKEN" | tr -d '[:space:]')
          node scripts/orochi-map.mjs --repo "$RUNNER_TEMP/sourcing" --out assets

      - name: Push it if it changed
        run: |
          git diff --quiet -- assets && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -qm "Refresh the Orochi commit map"
          git push -q
