name: Refresh the Orochi commit map

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: orochi-map

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Commits only, no trees or blobs, from the day Orochi started landing main.
      - name: Fetch the monorepo's history
        env:
          TOKEN: ${{ secrets.OROCHI_MAP_TOKEN }}
        run: >
          git clone -q --filter=tree:0 --no-checkout --single-branch --branch main
          --shallow-since=2026-10-21
          "https://x-access-token:${TOKEN}@github.com/GoliathData/sourcing.git" "$RUNNER_TEMP/sourcing"

      - name: Draw the map
        env:
          GH_TOKEN: ${{ secrets.OROCHI_MAP_TOKEN }}
        run: node scripts/orochi-map.mjs --repo "$RUNNER_TEMP/sourcing" --out assets

      - name: Push it if it changed
        run: |
          git diff --quiet -- assets && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -qm "Refresh the Orochi commit map"
          git push -q
